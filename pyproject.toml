[project]
name = "mcp-hostops"
version = "0.1.0"
description = "MCP-сервер для выполнения команд и передачи файлов по SSH через OpenSSH"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.0",
    "fastmcp>=4.0.2",
    "httpx2>=2.12.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# uvloop опционален: при наличии сервер берёт его, иначе обычный asyncio.
uvloop = ["uvloop>=0.22.1"]

[project.scripts]
mcp-hostops = "mcp_hostops:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hostops"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "T10",
    "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "PERF",
    "FLY", "RUF", "ASYNC", "S", "BLE", "TRY", "D", "ANN", "PGH",
]
ignore = [
    "D107",                        # __init__ описывается в докстринге класса (Google style)
    "RUF001", "RUF002", "RUF003",  # кириллица считается «неоднозначной»: текст по-русски
    "S603", "S607",                # subprocess/ssh — ядро инструмента, shell не используем
    "TRY003",                      # длинные сообщения прямо в raise — так читаемее
    "ASYNC109",                    # `timeout` — параметр инструмента run, часть его API
]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.ruff.lint.per-file-ignores]
# В тестах числовые ожидания и пароли — это данные, а не «магические значения»
# и не утечки; assert — сам механизм проверки.
"tests/**" = ["PLR2004", "S101", "S106", "D1"]  # D1: тест описывает имя, не докстринг

# Точка входа держит импорты внутри main(), чтобы импорт пакета оставался дешёвым
# и без side-effect (импорт сервера строит и монтирует роутеры).
"src/mcp_hostops/__init__.py" = ["PLC0415"]

# Докстринги — Google style: одна строка резюме, пустая строка, разделы
# Args/Returns/Raises там, где они добавляют к резюме.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["mcp_hostops"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# uvloop — опциональный extra, в обычном окружении его нет.
[[tool.mypy.overrides]]
module = ["uvloop"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["mcp_hostops"]

[tool.coverage.report]
show_missing = true
fail_under = 93  # текущее ~95%; порог чуть ниже, поднимать храповиком по мере тестов
